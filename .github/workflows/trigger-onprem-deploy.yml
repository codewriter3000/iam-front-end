name: Trigger OnPrem Frontend Deploy

on:
  workflow_dispatch:
    inputs:
      build_sha:
        description: Commit SHA to deploy
        required: true
        type: string
      build_artifact:
        description: Artifact name created by build workflow
        required: true
        default: frontend-build
        type: string
      deploy_env:
        description: Deployment environment configured in onprem-deployment
        required: true
        default: dev
        type: string
      target_ref:
        description: Branch/tag in codewriter3000/onprem-deployment containing deploy-frontend.yml
        required: true
        default: production
        type: string

permissions:
  contents: read

jobs:
  dispatch-remote-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy-frontend.yml in codewriter3000/onprem-deployment
        env:
          GH_TOKEN: ${{ secrets.ONPREM_DEPLOY_REPO_TOKEN }}
          BUILD_SHA: ${{ inputs.build_sha }}
          BUILD_ARTIFACT: ${{ inputs.build_artifact }}
          DEPLOY_ENV: ${{ inputs.deploy_env }}
          TARGET_REF: ${{ inputs.target_ref }}
          PUBLIC_REPO: ${{ github.repository }}
          TRIGGERED_BY: ${{ github.actor }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing secret ONPREM_DEPLOY_REPO_TOKEN"
            exit 1
          fi

          payload=$(cat <<JSON
          {
            "ref": "${TARGET_REF}",
            "inputs": {
              "build_sha": "${BUILD_SHA}",
              "public_repo": "${PUBLIC_REPO}",
              "triggered_by": "${TRIGGERED_BY}",
              "build_artifact": "${BUILD_ARTIFACT}",
              "deploy_env": "${DEPLOY_ENV}"
            }
          }
JSON
          )

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/codewriter3000/onprem-deployment/actions/workflows/deploy-frontend.yml/dispatches \
            -d "$payload"

          echo "Remote deploy workflow dispatched."
